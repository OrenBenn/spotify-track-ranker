<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Spotify Ranker</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  color: white;
  text-align: center;
}

#bg {
  position: fixed;
  width: 100%;
  height: 100%;
  background-size: cover;
  filter: blur(40px) brightness(0.4);
  z-index: -1;
}

.container {
  padding: 20px;
}

input {
  padding: 12px;
  border-radius: 10px;
  border: none;
}

button {
  padding: 12px 20px;
  border-radius: 10px;
  border: none;
  background: #1db954;
  color: white;
  cursor: pointer;
}

.albums img {
  width: 120px;
  border-radius: 10px;
  margin: 10px;
  cursor: pointer;
  transition: 0.2s;
}

.albums img:hover {
  transform: scale(1.1);
}

.battle {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-top: 40px;
}

.card {
  width: 200px;
  padding: 15px;
  border-radius: 20px;
  backdrop-filter: blur(10px);
  background: rgba(255,255,255,0.1);
  cursor: pointer;
  transition: 0.2s;
}

.card:hover {
  transform: scale(1.05);
}

.card img {
  width: 100%;
  border-radius: 10px;
}
</style>
</head>

<body>

<div id="bg"></div>

<div class="container">
<h1>🎧 Album Ranker</h1>

<input id="artistInput" placeholder="Artist name">
<button onclick="searchArtist()">Search</button>

<div class="albums" id="albums"></div>

<div class="battle" id="battle"></div>

<audio id="player"></audio>
</div>

<script>
const clientId = "3f3173e083604096abe93d93e05a8867";
const clientSecret = "76dff06debf5467aa7fe2dc911779134";

let token = "";
let tracks = [];
let queue = [];

async function getToken() {
  const res = await fetch("https://accounts.spotify.com/api/token", {
    method:"POST",
    headers:{
      "Authorization":"Basic "+btoa(clientId+":"+clientSecret),
      "Content-Type":"application/x-www-form-urlencoded"
    },
    body:"grant_type=client_credentials"
  });
  const data = await res.json();
  token = data.access_token;
}

async function searchArtist(){
  const name = document.getElementById("artistInput").value;

  const res = await fetch(`https://api.spotify.com/v1/search?q=artist:${name}&type=artist`,{
    headers:{Authorization:`Bearer ${token}`}
  });

  const data = await res.json();
  loadAlbums(data.artists.items[0].id);
}

async function loadAlbums(id){
  const res = await fetch(`https://api.spotify.com/v1/artists/${id}/albums`,{
    headers:{Authorization:`Bearer ${token}`}
  });

  const data = await res.json();
  const container = document.getElementById("albums");
  container.innerHTML="";

  data.items.forEach(a=>{
    const img = document.createElement("img");
    img.src = a.images[0]?.url;
    img.onclick = () => loadTracks(a.id, a.images[0]?.url);
    container.appendChild(img);
  });
}

async function loadTracks(id, cover){
  document.getElementById("bg").style.backgroundImage = `url(${cover})`;

  const res = await fetch(`https://api.spotify.com/v1/albums/${id}`,{
    headers:{Authorization:`Bearer ${token}`}
  });

  const data = await res.json();
  tracks = data.tracks.items;
  queue = [...tracks];

  nextBattle();
}

function play(url){
  if(!url) return;
  const p = document.getElementById("player");
  p.src = url;
  p.play();
}

function nextBattle(){
  if(queue.length < 2) return;

  const a = queue.shift();
  const b = queue.shift();

  const battle = document.getElementById("battle");
  battle.innerHTML = "";

  const left = createCard(a);
  const right = createCard(b);

  left.onclick = () => choose(a,b);
  right.onclick = () => choose(b,a);

  battle.appendChild(left);
  battle.appendChild(right);

  play(a.preview_url);
}

function createCard(track){
  const div = document.createElement("div");
  div.className = "card";

  div.innerHTML = `
    <img src="${track.album.images[0]?.url}">
    <p>${track.name}</p>
  `;

  return div;
}

function choose(w,l){
  play(w.preview_url);
  queue.push(l);
  nextBattle();
}

getToken();
</script>

</body>
</html>
